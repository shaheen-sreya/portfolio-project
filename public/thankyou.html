<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Thank You</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            height: 100vh;
            background: #f9f9fc;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Poppins', sans-serif;
            color: #222;
        }

        .box {
            text-align: center;
            padding: 50px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.05);
            transition: 0.3s;
        }

        .box:hover {
            transform: translateY(-5px);
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 40px;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 20px;
        }

        a {
            text-decoration: none;
            padding: 12px 25px;
            background: #a18cd1;
            color: white;
            border-radius: 8px;
            transition: 0.3s;
        }

        a:hover {
            box-shadow: 0 0 10px #a18cd1;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>Thank You 🤍</h1>
        <p>Your message has been sent successfully.</p>

        <a href="/">Go Back</a>
    </div>

</body>
</html>
