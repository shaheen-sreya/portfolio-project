<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <section>
        <h1>Welcome to My Portfolio</h1>
        <p>Exploring web development and creating small projects.</p>
    </section>

    <section id="about">
        <h2>About Me</h2>
        <p>Hello! I am a student exploring web development. I love creating small projects and learning new technologies.</p>
    </section>
 
    <section id="contact">
        <h2>Contact Me</h2>
        <p>Fill in your details and I’ll get back to you!</p>
        <form action="/contact" method="POST">
            <input type="text" name="name" placeholder="Your Name" required>
            <input type="email" name="email" placeholder="Your Email" required>
            <textarea name="message" rows="4" placeholder="Your Message"></textarea>
            <button type="submit">Send</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
